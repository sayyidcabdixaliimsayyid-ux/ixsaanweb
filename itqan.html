<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدارس الإتقان — لوحة التحكم</title>
<style>
*{box-sizing:border-box}
:root{--gold:#c9a04a;--green:#1b6b3a;--dark:#123d24;--cream:#fbf7ee}
body{margin:0;font-family:Tahoma,Cairo,sans-serif;color:#2a1d0a;min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(201,160,74,.18),transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(27,107,58,.18),transparent 40%),
    var(--cream);
  overflow-x:hidden}
.pattern{position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><g fill='none' stroke='%23c9a04a' stroke-opacity='.35' stroke-width='1.2'><path d='M45 0 L63 18 L90 18 L72 45 L90 72 L63 72 L45 90 L27 72 L0 72 L18 45 L0 18 L27 18 Z'/><path d='M45 18 L63 45 L45 72 L27 45 Z'/><circle cx='45' cy='45' r='6'/></g></svg>");
  background-size:90px 90px;animation:drift 60s linear infinite}
@keyframes drift{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* الترويسة */
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--dark),var(--green));color:#fff;padding:14px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);position:relative;overflow:hidden}
.header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:translateX(-100%);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.logoBox{background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:float 4s ease-in-out infinite;display:block}
.logoBox img{height:70px;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.title{text-align:center;flex:1;min-width:200px;position:relative;z-index:1}
.title h1{margin:0;font-size:26px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.title .sub{font-size:13px;opacity:.9;margin-top:2px}

/* الشريط الذهبي */
.ticker{background:var(--gold);color:var(--dark);overflow:hidden;white-space:nowrap;padding:8px 0;font-weight:700}
.ticker-track{display:inline-block;padding-left:100%;animation:scroll 30s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ticker .sep{margin:0 26px;color:var(--green)}

/* الترحيب */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px}
.who{font-size:17px;font-weight:800;color:var(--dark)}
.role{font-size:13px;color:#6b5a3e}
.logout{background:#b3261e;color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;cursor:pointer}

/* بطاقات الإحصاء */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 20px}
.stat{background:rgba(255,255,255,.9);border:1px solid #e8d3a2;border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06);animation:fadeUp .6s ease both}
.stat .n{font-size:28px;font-weight:900;color:var(--green)}
.stat .t{font-size:13px;color:#6b5a3e}

/* الأزرار الملونة */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:18px 20px 6px}
.tile{position:relative;display:block;width:100%;border:0;font:inherit;text-align:right;cursor:pointer;color:#fff;border-radius:20px;padding:20px 18px;min-height:112px;overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .25s ease,box-shadow .25s ease;animation:fadeUp .6s ease both}
.tile:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 28px rgba(0,0,0,.2)}
.tile::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M20 0 L26 14 L40 20 L26 26 L20 40 L14 26 L0 20 L14 14 Z' fill='none' stroke='%23ffffff' stroke-opacity='.12'/></svg>");opacity:.8}
.tile::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .7s ease}
.tile:hover::after{left:125%}
.tile>*{position:relative;z-index:1}
.tile .ic{font-size:30px;display:block;margin-bottom:4px;animation:bob 2.8s ease-in-out infinite}
.tile .tt{font-size:17px;font-weight:800;display:block}
.tile .ds{font-size:12px;opacity:.92;display:block}
.tile.on{outline:4px solid #f7d27a;outline-offset:3px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.c-orange{background:linear-gradient(135deg,#e5572a,#f7941d)}
.c-green{background:linear-gradient(135deg,#1b6b3a,#2f9e5a)}
.c-blue{background:linear-gradient(135deg,#0b5c9a,#2196d3)}
.c-gold{background:linear-gradient(135deg,#a86a00,#e0a526)}
.c-dark{background:linear-gradient(135deg,#4a3a2a,#7a5c3a)}
.c-purple{background:linear-gradient(135deg,#5b3a8c,#8e62c9)}
.c-teal{background:linear-gradient(135deg,#0f6e66,#1fa597)}
.c-red{background:linear-gradient(135deg,#8c2030,#c8404f)}

/* المحتوى */
.page{padding:12px 20px 40px}
.card{background:rgba(255,255,255,.95);border:1px solid #e8d3a2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 16px rgba(0,0,0,.06);animation:fadeUp .5s ease both}
.card h3{margin:0 0 10px;color:var(--green);font-weight:900}
.pickRow{background:rgba(255,255,255,.95);border:2px solid var(--green);border-radius:16px;padding:12px 14px;margin:12px 0}
input,select{font:inherit;padding:10px;border:1px solid #e8d3a2;border-radius:12px;box-sizing:border-box;margin:3px 0;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input,.row>select{flex:1 1 150px}
.row>label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700;color:var(--dark)}
button.b{font:inherit;font-weight:800;background:linear-gradient(135deg,#e5572a,#f7941d);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 10px rgba(229,87,42,.25)}
button.b:hover{transform:translateY(-1px)}
button.b.g{background:linear-gradient(135deg,#1b6b3a,#2f9e5a);box-shadow:0 4px 10px rgba(27,107,58,.25)}
button.b.m{background:linear-gradient(135deg,#7a5c3a,#a88a5c)}
button.b.r{background:linear-gradient(135deg,#8c2030,#c8404f)}
.back{background:#fff;color:var(--green);border:2px solid var(--green);border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;margin-bottom:10px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05)}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #f0e4c4;vertical-align:middle}
th{background:linear-gradient(120deg,#123d24,#1b6b3a);color:#fff;font-weight:800}
tr:nth-child(even) td{background:#fdfaf2}
.tw{overflow-x:auto}
.ok{color:#1b6b3a;font-weight:800}
.bad{color:#b3261e;font-weight:800}
.grp{background:linear-gradient(90deg,#fbf0d4,#fbf7ee);border-right:6px solid var(--gold);padding:10px 14px;margin:16px 0 8px;border-radius:12px;font-weight:900;color:var(--dark);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{color:#b3261e;font-weight:800;min-height:20px;margin:6px 0}
.note{color:#6b5a3e;font-size:13px}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* شاشة الدخول */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:18px}
#login .logoBox img{height:120px}
.loginCard{background:rgba(255,255,255,.95);border-radius:22px;padding:26px;width:100%;max-width:420px;box-shadow:0 14px 34px rgba(0,0,0,.14);animation:fadeUp .7s ease both}
.loginCard h2{text-align:center;color:var(--green);margin:4px 0 14px;font-weight:900}
.loginCard input{width:100%;padding:12px;margin:6px 0}
.loginCard button{width:100%;font:inherit;font-weight:800;background:linear-gradient(135deg,#e5572a,#f7941d);color:#fff;border:0;border-radius:12px;padding:12px;cursor:pointer;margin-top:8px}

.binfo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bphoto{width:150px;height:105px;object-fit:cover;border-radius:14px;border:2px solid #c9a04a;flex:none}
.bphoto.ph{display:flex;align-items:center;justify-content:center;font-size:40px;background:#fbf6e9}
/* شعار المنظمة: زر الرجوع، يتحرك ويلمع */
.ihsanLink{position:relative;display:inline-block;overflow:hidden;border-radius:8px;perspective:300px;vertical-align:middle}
.ihsanImg{display:block;animation:ihsanLogoFx 5s infinite ease-in-out;backface-visibility:hidden}
.ihsanLink::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:ihsanBeam 5s infinite;pointer-events:none}
@keyframes ihsanLogoFx{
0%,100%{transform:translateX(0) rotateY(360deg) scale(1);opacity:1;filter:none}
8%{transform:translateX(-14px) rotateY(180deg);opacity:1;filter:none}
16%{transform:translateX(0) rotateY(360deg);opacity:1}
24%{transform:translateY(0) rotateY(360deg) scale(1);opacity:1}
34%{transform:translateY(18px) rotateY(360deg) scaleY(.3);opacity:0;filter:blur(8px)}
44%{transform:translateY(18px) rotateY(360deg) scaleY(.3);opacity:0;filter:blur(8px)}
56%{transform:translateY(0) rotateY(360deg) scale(1.06);opacity:1;filter:blur(0)}
62%{transform:translateY(0) rotateY(360deg) scale(1);opacity:1;filter:none}
}
@keyframes ihsanBeam{0%,60%{left:-60%}80%,100%{left:120%}}
.lnk{color:#1d4ed8;text-decoration:underline;cursor:pointer;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.ovBox{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px;direction:rtl}
.ovBox h3{margin:0 0 10px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
@media(max-width:560px){.dl{grid-template-columns:1fr}}
body,button,input,select,textarea,table{font-family:'Tajawal',Tahoma,sans-serif!important}
.showLogo{display:flex;justify-content:center;align-items:center;padding:18px 14px;margin:6px 0 18px;border-radius:22px;background:linear-gradient(135deg,var(--c1,#0b2f22),var(--c2,#14532d) 55%,var(--c1,#0b2f22));box-shadow:0 16px 40px rgba(20,83,45,.35);overflow:hidden;position:relative}
.goldLogo{width:min(760px,100%);aspect-ratio:914/220;position:relative;z-index:1;
  background:linear-gradient(115deg,#7a5a12 0%,#d4a53a 20%,#fff1b5 38%,#e7b94a 52%,#9c7317 72%,#f5d77a 90%);
  -webkit-mask:url(itqan-branch1-logo.png) center/contain no-repeat;mask:url(itqan-branch1-logo.png) center/contain no-repeat;
  animation:logoSway 9s ease-in-out infinite;
  filter:drop-shadow(0 0 12px rgba(255,205,90,.65)) drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.showLogo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,215,120,.32) 50%,transparent 65%);transform:translateX(-120%);animation:shineSlow 7s ease-in-out infinite;pointer-events:none}
@keyframes logoSway{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
@keyframes shineSlow{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes btnShine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.showTop{margin:6px 0 12px}
.hGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.hBtn{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:24px 16px;border:none;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--b1,#166534),var(--b2,#15803d) 55%,var(--b3,#0f766e));box-shadow:0 10px 26px rgba(21,128,61,.35);transition:transform .25s,box-shadow .25s}
.hBtn:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(21,128,61,.45)}
.hBtn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:btnShine 4.5s ease-in-out infinite;pointer-events:none}
.hName{font-size:20px;font-weight:800}
.hTeacher{font-size:14px;opacity:.92}
.hCount{font-size:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px}
.hHead{background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #e5e7eb;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.hHead h2{margin:0;font-size:24px;font-weight:800;flex:1}
.sGrid{display:grid;grid-template-columns:1fr;gap:10px;max-width:760px;margin:0 auto}
.sCard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.fin{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.finHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.finHead h3{margin:0;font-size:22px;font-weight:800}
.finCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.fc{border-radius:18px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 26px rgba(0,0,0,.16)}
.fc span{font-size:14px;opacity:.92}
.fc b{font-size:30px;font-weight:800}
.fc.ok{background:linear-gradient(135deg,#166534,#22c55e)}
.fc.bad{background:linear-gradient(135deg,#7f1d1d,#ef4444)}
.fc.info{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.finT{width:100%;border-collapse:collapse;background:#fff}
.finT th,.finT td{padding:10px;border-bottom:1px solid #eef0f3;text-align:center}
.finT th{background:#14532d;color:#fff;font-weight:800}
.finT .pos{color:#15803d;font-weight:800}
.finT .neg{color:#b91c1c;font-weight:800}
.finT tr.tot td{background:#fef3c7;font-weight:800}
.bars{height:7px;background:#eef0f3;border-radius:4px;overflow:hidden;margin:3px 0}
.bars i{display:block;height:100%;border-radius:4px}
.bi{background:linear-gradient(90deg,#4ade80,#15803d)}
.be{background:linear-gradient(90deg,#fca5a5,#b91c1c)}
.expT{border-collapse:collapse;background:#fff}
.expT th,.expT td{padding:6px;border-bottom:1px solid #eef0f3;white-space:nowrap;text-align:center}
.expT th{background:#14532d;color:#fff;font-weight:800}
.expT td:first-child{text-align:right;font-weight:700;background:#f8fafc}
.expT input{width:86px;padding:5px;border:1px solid #d6dbe3;border-radius:8px;text-align:center}
.expT tr.tot td{background:#fef3c7;font-weight:800}
.rowT{font-weight:800;color:#14532d}
/* خطوط أكبر للأسماء والقوائم */
body{font-size:17px}
table td,table th{font-size:17px}
.tw table td,.tw table th{padding-top:12px;padding-bottom:12px}
select,input,button,textarea{font-size:16px}
.lnk{font-size:18px}
.sCard{font-size:18px}
.hHead h2{font-size:28px}
.hName{font-size:22px}
.hTeacher{font-size:16px}
.note{font-size:15px}
.grp{font-size:18px}
body.ro #content button:not(.tile):not(.hBtn):not(.b.m):not(.keepRO):not(.lnk){pointer-events:none;opacity:.45}
body.ro #content input:not([type=month]):not([type=checkbox]),
body.ro #content select[onchange^="moveStudent"],
body.ro #content select[onchange^="setTeacher"],
body.ro #content select[id^="cg_"],body.ro #content select[id^="ch_"],
body.ro #content select[id="rGender"],body.ro #content select[id="rHalaqa"]{pointer-events:none;opacity:.7}
body.ro-assoc .wr{display:none!important}
body.ro-modal #stuOv .b.g{display:none!important}
body.ro-modal #stuOv input,body.ro-modal #stuOv select{pointer-events:none;opacity:.7}
.roNote{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700}
body.ro-view #content button:not(.tile):not(.hBtn):not(.b.m):not(.keepRO):not(.lnk){pointer-events:none;opacity:.45}
body.ro-view #content input:not([type=month]){pointer-events:none;opacity:.7}
/* شعار الجمعية الكبير في شاشة الدخول */
#login{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 12px}
.heroLogo{position:relative;overflow:hidden;border-radius:32px;padding:16px 22px;background:radial-gradient(circle at 50% 40%,#fffdf5,#f1e7cc 75%);box-shadow:0 26px 60px rgba(20,83,45,.28);display:inline-block;max-width:96vw}
.heroLogo img{display:block;height:min(70vh,860px);width:auto;max-width:90vw;animation:heroMove 9s ease-in-out infinite;filter:drop-shadow(0 12px 24px rgba(0,0,0,.25))}
.heroLogo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,215,120,.5) 50%,transparent 65%);transform:translateX(-120%);animation:shineSlow 6s ease-in-out infinite;pointer-events:none}
@keyframes heroMove{0%,100%{transform:translate(0,0) rotate(-1.2deg) scale(1)}25%{transform:translate(8px,-10px) rotate(0deg) scale(1.02)}50%{transform:translate(0,-18px) rotate(1.2deg) scale(1.04)}75%{transform:translate(-8px,-8px) rotate(0deg) scale(1.02)}}
.heroLogo img{height:auto!important;width:min(88vw,920px)!important;max-width:88vw!important}
.heroLogo{padding:22px 28px}
.plainLogo{background:#fff!important;border:1px solid rgba(0,0,0,.06)}
.plainLogo img{width:min(760px,100%);height:auto;display:block;animation:logoSway 9s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18))}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="pattern"></div>

<div id="gate">
  <div id="login">
    <div class="heroLogo"><img src="quran-logo.png" alt="شعار الجمعية القرآنية في كينيا" onerror="this.onerror=null;this.src='ihsan-logo.png'"></div>
    <div class="loginCard">
      <h2>أهلاً بكم في نظام الجمعية لإدارة مدارس الإتقان</h2>
      <input id="gEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="gPass" type="password" placeholder="كلمة المرور">
      <button onclick="login()">دخول</button>
      <div id="gateMsg" class="msg"></div>
      <a href="index.html" style="display:block;margin-top:14px;text-align:center;color:#fff;font-weight:700">← العودة إلى الجمعية</a>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="logoBox"><img src="quran-logo.png" onerror="this.onerror=null;this.src='ihsan-logo.png'" alt="شعار الجمعية القرآنية" style="height:70px;display:block"></div>
    <div class="title">
      <h1>الجمعية القرآنية في كينيا</h1>
      <div class="sub">منظمة الإحسان للرعاية الاجتماعية</div>
    </div>
    <a href="index.html" class="logoBox ihsanLink" title="العودة إلى موقع المنظمة" style="padding:6px 10px"><img class="ihsanImg" src="ihsan-logo.png" alt="منظمة الإحسان" style="height:56px;display:block;background:#fff;border-radius:8px;padding:4px"></a>
  </div>

  <div class="ticker"><div class="ticker-track">قال تعالى: ﴿إن هذا القرآن يهدي للتي هي أقوم﴾ <span class="sep">✦</span> تعليم قرآني فريد <span class="sep">✦</span> مدارس رائدة <span class="sep">✦</span> مسابقات <span class="sep">✦</span> وكوادر ملهمة <span class="sep">✦</span></div></div>

  <div class="bar">
    <div>
      <div class="who" id="who"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a href="index.html" style="display:inline-block;background:#1b6b3a;color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;text-decoration:none;font-size:15px">← العودة إلى الجمعية</a><button id="outBtn" class="logout hidden" onclick="logout()">خروج</button></div>
  </div>

async function login(){
  const {error}=await db.auth.signInWithPassword({email:$('gEmail').value.trim(),password:$('gPass').value});

  enter();
}

async function enter(){
  const {data:{user}}=await db.auth.getUser();
  if(!user) return;
  const {data:prof,error}=await db.from('profiles').select('full_name,role,branch_id,all_panels,itqan_editor').eq('id',user.id).single();
  if(prof&&prof.role==='itqan_teacher'){location.href='mushaf-progress.html';return}
  if(prof&&prof.all_panels) prof.role='itqan_association_manager';
  if(error||!prof||!ROLE_LABEL[prof.role]){
    $('gateMsg').textContent='هذا الحساب غير مرتبط بمدارس الإتقان';
    await db.auth.signOut();return;
  }
  ME=prof;
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('outBtn').classList.remove('hidden');
  $('who').textContent='مرحباً، '+prof.full_name+' — '+ROLE_LABEL[prof.role];
  V.branch=rk()==='association'?'':ME.branch_id;
  await loadAll();
  if(rk()==='association'&&BR.length) V.branch=BR[0].id;

}

async function loadAll(){
  const q=[
    db.from('itqan_branches').select('*').order('sort_order'),
    db.from('itqan_teachers').select('*').order('full_name').range(0,9999),
    db.from('itqan_halaqat').select('*').order('name').range(0,9999),
    db.from('itqan_students').select('*').order('full_name').range(0,9999),
    db.from('itqan_payments').select('*').range(0,9999),
    db.from('itqan_managers').select('*').order('full_name').range(0,9999),
    db.from('itqan_expenses').select('*').range(0,9999)
  ];
  if(rk()==='association') q.push(db.from('profiles').select('id,full_name,role,branch_id').in('role',Object.keys(ROLE_LABEL)));
  const r=await Promise.all(q);
  const bad=r.find(x=>x.error);
  if(bad) msg('تعذّر التحميل: '+bad.error.message);
  BR=r[0].data||[]; TE=r[1].data||[]; HA=r[2].data||[]; ST=r[3].data||[]; PY=r[4].data||[];
  MG=r[5].data||[];
  EX=r[6]?.data||[];
  PEOPLE=r[7]?.data||[];
}

async function dbDo(p,ok){
  const {error}=await p;

}

  const needs=BRANCH_TABS.includes(V.tab);
  $('pick').innerHTML=needs?pickerHtml():'';
  $('pick').classList.toggle('hidden',!needs);
  const info=needs&&scope()?branchInfo():'';

  const roInt=ME.role==='itqan_association_manager'&&!ME.itqan_editor;

  $('content').setAttribute('style',themeCss(V.show||ME.branch_id||V.branch||''));
  $('content').innerHTML=topBan+(document.body.classList.contains('ro')?`<div class="roNote">${roMsg}</div>`:'')+info+(RV[V.tab]?RV[V.tab]():'');

async function uploadBranchPhoto(bid,file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`branches/${bid}/${Date.now()}.${ext}`;
  const {error}=await db.storage.from('itqan-media').upload(path,file,{contentType:file.type||undefined,upsert:false});
  if(error) throw new Error(error.message);
  return path;
}

async function saveBranch(id){
  try{
    const name=$('bn_'+id).value.trim();
    if(!name) return msg('اكتب اسم الفرع');
    const row={name,address:$('ba_'+id).value.trim()||null,location_url:$('bl_'+id).value.trim()||null,
      monthly_fee:+$('bf_'+id).value||0,admission_fee:+$('bd_'+id).value||0};
    const f=$('bp_'+id).files[0];
    if(f) row.photo_path=await uploadBranchPhoto(id,f);
    dbDo(db.from('itqan_branches').update(row).eq('id',id),'تم حفظ بيانات الفرع ✓');
  }catch(e){ msg('تعذّر الحفظ: '+e.message); }
}

let XL_LOADED=false;
const normAr=s=>String(s??'').replace(/[ً-ْـ​-‏ ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const key=s=>normAr(s).replace(/ /g,'');
const isNameHdr=c=>{const t=normAr(c);return t==='اسم طالب'||t==='الاسم'||t==='اسم الطالب'||(t.includes('اسم')&&t.includes('طالب'))};

const genderOf=g=>/بنت|بنات|انثى|أنثى/.test(g||'')?'girl':(/ولد|بنين|ذكر/.test(g||'')?'boy':null);

function loadXlsx(){
  if(window.XLSX) return Promise.resolve();
  const urls=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  const tryLoad=i=>new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=urls[i];
    s.onload=()=>window.XLSX?res():rej(new Error('المكتبة لم تُهيّأ'));
    s.onerror=()=>rej(new Error('فشل التحميل من '+urls[i]));
    document.head.appendChild(s);
  });
  return tryLoad(0).catch(()=>tryLoad(1)).catch(e=>{throw new Error('تعذّر تحميل مكتبة Excel. تحقق من الاتصال بالإنترنت ثم أعد المحاولة ('+e.message+')')});
}

/* كل ورقة = حلقة. العنوان في الصفوف فوق الترويسة: «حلقة <الاسم> أ. <المعلم>» */
function parseSheet(ws,sheetName){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false});
  const hIdx=rows.findIndex(r=>r.some(isNameHdr));
  if(hIdx<0) return null;
  const nameCol=rows[hIdx].findIndex(isNameHdr);
  const genCol=rows[hIdx].findIndex(c=>normAr(c)==='الجنس');
  const amtCol=rows[hIdx].findIndex(c=>normAr(c).includes('مبلغ'));
  let halaqa=sheetName.trim(), teacher='';
  for(let i=0;i<hIdx;i++){
    const raw=rows[i].filter(c=>String(c).trim()!=='').map(c=>String(c).replace(/[\u0640\u200B-\u200F]/g,'')).join(' ').replace(/\s+/g,' ').trim();
    const m=raw.match(/^حلق[ةه]\s+(.+?)\s+[أإاآ](?=[\s.])[\s.]*(.*)$/);
    if(m){ halaqa=m[1].trim(); teacher=m[2].trim(); break; }
  }
  const students=[];
  for(let i=hIdx+1;i<rows.length;i++){
    const name=String(rows[i][nameCol]??'').replace(/\s+/g,' ').trim();
    if(!name||/مجموع|الإجمالي|الاجمالي/.test(name)) continue;
    students.push({name,g:genCol>=0?String(rows[i][genCol]??'').trim():'',amt:amtCol>=0?rows[i][amtCol]:''});
  }
  return {halaqa,teacher,students};
}

async function importExcel(){
  const bid=$('xlBranch').value, f=$('xlFile').files[0];
  if(!bid) return msg('اختر الفرع');
  if(!f) return msg('اختر ملف Excel أولاً');
  try{
    msg('جارٍ قراءة الملف…',true);
    await loadXlsx();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const parsed=wb.SheetNames.map(n=>parseSheet(wb.Sheets[n],n)).filter(Boolean);
    if(!parsed.length) return msg('لم أجد عموداً بعنوان «اسم طالب» في أي ورقة من الملف');

    /* 1) المعلمون: يُنشأ الناقص */
    const tKeys=new Map();
    TE.filter(t=>t.branch_id===bid).forEach(t=>tKeys.set(key(t.full_name),t.id));
    const newT=[];
    parsed.forEach(p=>{const k=key(p.teacher); if(k&&!tKeys.has(k)){tKeys.set(k,null); newT.push({branch_id:bid,full_name:p.teacher});}});
    if(newT.length){
      const {data,error}=await db.from('itqan_teachers').insert(newT).select();
      if(error) return msg('تعذّر إنشاء المعلمين: '+error.message);
      data.forEach(t=>tKeys.set(key(t.full_name),t.id));
    }

    /* 2) الحلقات: تُطابَق بالاسم، ويُنشأ الناقص */
    const hKeys=new Map();
    HA.filter(h=>h.branch_id===bid).forEach(h=>hKeys.set(key(h.name),h.id));
    const hMatch=name=>{
      const k=key(name);
      if(hKeys.has(k)) return hKeys.get(k);
      for(const [hk,id] of hKeys) if(k.length>=6&&hk.length>=6&&(hk.includes(k)||k.includes(hk))) return id;
      return null;
    };
    const newH=[], seenH=new Set();
    parsed.forEach(p=>{
      const k=key(p.halaqa);
      if(hMatch(p.halaqa)||seenH.has(k)) return;
      seenH.add(k);
      newH.push({branch_id:bid,name:p.halaqa,kind:'quran',teacher_id:tKeys.get(key(p.teacher))||null});
    });
    if(newH.length){
      const {data,error}=await db.from('itqan_halaqat').insert(newH).select();
      if(error) return msg('تعذّر إنشاء الحلقات: '+error.message);
      data.forEach(h=>hKeys.set(key(h.name),h.id));
    }

    /* 3) الطلاب: بالاسم فقط، ويُتخطّى المكرر داخل الفرع */
    const existingMap=new Map(ST.filter(s=>s.branch_id===bid).map(s=>[key(s.full_name),s]));
    const existing=new Set(existingMap.keys());
    const fills=[];
    const branchFee=Number(brOf(bid)?.monthly_fee||0);
    const out=[], report=[]; let dup=0;
    parsed.forEach(p=>{
      const hid=hMatch(p.halaqa); let c=0;
      p.students.forEach(st=>{
        const n=st.name, k=key(n);
        const amt=(st.amt===''||st.amt==null)?NaN:Number(st.amt);
        const gen=genderOf(st.g);
        if(existing.has(k)){
          dup++;
          const prev=existingMap.get(k);
          if(prev){
            const patch={};
            if(!prev.gender&&gen) patch.gender=gen;
            if(!isNaN(amt)&&amt>0&&amt!==branchFee&&prev.monthly_fee==null&&!prev.exempt) patch.monthly_fee=amt;
            if(Object.keys(patch).length) fills.push({id:prev.id,patch});
          }
          return;
        }
        existing.add(k);
        out.push({branch_id:bid,full_name:n,gender:gen,halaqa_id:hid,exempt:false,monthly_fee:(!isNaN(amt)&&amt>0&&amt!==branchFee)?amt:null});
        c++;
      });
      report.push(`${p.halaqa}: ${c}`);
    });
    const redN=out.filter(x=>x.monthly_fee!=null).length;
    const zeroN=parsed.reduce((a,p)=>a+p.students.filter(st=>st.amt!==''&&st.amt!=null&&Number(st.amt)===0).length,0);
    let filled=0;
    for(const f of fills){ const {error}=await db.from('itqan_students').update(f.patch).eq('id',f.id); if(!error) filled++; }
    if(!out.length){
      if(filled){ await loadAll(); paint(); return msg(`حُدّث ${filled} طالباً موجوداً ✓`,true); }
      return msg('لا يوجد طلاب جدد في الملف'+(dup?` (تكرّر ${dup} اسماً موجوداً)`:''));
    }
    for(let i=0;i<out.length;i+=200){
      const {error}=await db.from('itqan_students').insert(out.slice(i,i+200));
      if(error) return msg('تعذّر الاستيراد عند الطالب '+(i+1)+': '+error.message);
    }
    await loadAll();
    msg(`تم استيراد ${out.length} طالباً في ${parsed.length} حلقة ✓`+(newH.length?` — أُنشئت ${newH.length} حلقة`:'')+(newT.length?` وأُنشئ ${newT.length} معلماً`:'')+(dup?` — تُخطّي ${dup} مكرراً`:'')+` — مخفّض: ${redN}، لم يسدّدوا: ${zeroN}`+(filled?` — حُدّث ${filled} موجوداً`:'')+' — راجع الجنس من «استكمال بيانات الطلاب»',true);
    paint();
  }catch(e){ msg('تعذّر قراءة الملف: '+e.message); }
}

function downloadTemplate(){
  loadXlsx().then(()=>{
    const ws=XLSX.utils.aoa_to_sheet([
      ['الاسم','الجنس','ولي الأمر','الهاتف','العنوان','تاريخ الميلاد','الحلقة'],
      ['مثال: أحمد علي','بنين','محمد علي','0700000000','نيروبي','2015-05-01','القراءة والكتابة (1)']
    ]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'الطلاب');
    XLSX.writeFile(wb,'نموذج-طلاب-الإتقان.xlsx');
  }).catch(e=>msg(e.message));
}

const dOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const DAILY_ATT={present:'حاضر',absent:'غائب',late:'متأخر',excused:'بعذر'};
const DAILY_ATT_CLS={present:'#1b6b3a',absent:'#c8404f',late:'#c9a04a',excused:'#4a6fa5'};
let DG='teacher';
const setDG=v=>{DG=v;paint()};
const TOTAL_AYAHS=6236;
function dailyCard(){
  const on=v=>DG===v?'b g':'b gray';
  return `<div class="card" id="dailyBox"><h3>نتيجة المعلمين: التحضير والتسميع</h3>

      <button class="${on('teacher')}" onclick="setDG('teacher')">فرز حسب المعلم</button>

    </div>
    <div id="dailyBody" class="note">جارٍ التحميل…</div></div>`;
}
const PERIODS_M=[['sabah','الصباح'],['fasl','بعد الفسح'],['ghada','بعد الغذاء']];
const RECN_M={tasmee:'التسميع',muraja:'المراجعة',sabaa:'السبع'};
async function loadDaily(){
  const body=$('dailyBody'); if(!body) return;
  const b=scope(); if(!b) return;
  const [rs,ss,sb]=await Promise.all([
    db.from('itqan_daily').select('*').eq('branch_id',b).gte('day',dOff(-400)),
    db.from('itqan_students').select('id,full_name,halaqa_id,quran_base_ayah,quran_last_ayah,quran_last_page').eq('branch_id',b).order('full_name'),
    db.from('itqan_submissions').select('halaqa_id,day,submitted_at').eq('day',dOff(0))
  ]);
  if(!body.isConnected) return;
  if(rs.error||ss.error){body.innerHTML='<div class="note">تعذّر التحميل: '+esc((rs.error||ss.error).message)+'</div>';return}
  const R=rs.data||[], S=ss.data||[], today=dOff(0);
  const subbed=new Set((sb.data||[]).map(x=>x.halaqa_id+'|'+x.period));   // تسليمات اليوم حسب الحلقة والفترة
  const subbedAny=new Set((sb.data||[]).map(x=>x.halaqa_id));              // حلقات سلّمت شيئاً اليوم
  const HAs=HA.filter(h=>h.branch_id===b), TEs=TE.filter(t=>t.branch_id===b);
  // بيانات كل طالب
  const info=new Map(S.map(s=>{
    const mine=R.filter(r=>r.student_id===s.id);
    const att={};
    PERIODS_M.forEach(([p])=>{att[p]=mine.find(r=>r.day===today&&r.period===p)||null});
    const recAll={};
    Object.keys(RECN_M).forEach(k=>{recAll[k]=mine.find(r=>r.day===today&&r.period===k&&r.ayah_from!=null)||null});
    const rw=HA.find(h=>h.id===s.halaqa_id)?.kind==='rw';
    const recs=mine.filter(r=>r.period==='tasmee'&&r.ayah_from!=null).sort((x,y)=>y.day.localeCompare(x.day));
    const last10=recs.slice(0,10);
    const rate=last10.length?last10.reduce((a,r)=>a+(r.ayah_to-r.ayah_from+1),0)/last10.length:0;
    // الموضع = عدد الآيات المسموعة بترتيب القراءة (من الناس نحو البقرة)
    const doneAyahs=s.quran_last_ayah!=null?s.quran_last_ayah+1:(s.quran_base_ayah!=null?s.quran_base_ayah+1:0);
    const left=TOTAL_AYAHS-doneAyahs;
    const days=rate>0?Math.ceil(left/rate):null;
    let finish=null; if(days!=null){const d=new Date();d.setDate(d.getDate()+days);finish=d.toLocaleDateString('ar',{day:'numeric',month:'long',year:'numeric'})}
    return [s.id,{s,att,rw,recAll,recToday:recAll.tasmee,rate,left,days,finish,doneAyahs,pages:s.quran_last_page}];
  }));
  const row=(x,showHalaqa)=>{
    const {s,att,rw,recAll,rate,left,days,finish,doneAyahs,pages}=x;
    const hh=HA.find(h=>h.id===s.halaqa_id);
    const pctDone=(doneAyahs/TOTAL_AYAHS*100).toFixed(1);
    const attTxt=PERIODS_M.map(([p,n])=>{
      if(!subbed.has(s.halaqa_id+'|'+p)) return `${n}: <span class="note">⏳</span>`;
      const a=att[p]?.attendance;
      return `${n}: `+(a?`<span style="color:${DAILY_ATT_CLS[a]};font-weight:800">${DAILY_ATT[a]}</span>`:'—');
    }).join('<br>');
    const recTxt=rw?'<span class="note">قراءة وكتابة — لا تسميع</span>'
      :Object.keys(RECN_M).map(k=>{
        if(!subbed.has(s.halaqa_id+'|'+k)) return `${RECN_M[k]}: <span class="note">⏳</span>`;
        const r=recAll[k];
        return `${RECN_M[k]}: `+(r?`${r.ayah_to-r.ayah_from+1} آية (${r.page_from===r.page_to?'صفحة '+r.page_from:'من صفحة '+r.page_from+' إلى '+r.page_to})`:'—');
      }).join('<br>');
    const dash=rw?'—':null;
    return `<tr>
      <td>${sName(s)}</td>
      ${showHalaqa?`<td>${esc(hh?.name||'—')}</td>`:''}
      <td>${attTxt}</td>
      <td>${recTxt}</td>
      <td>${pages&&!rw?'صفحة '+pages:'—'}</td>
      <td>${rw?'—':`${left} آية (${(left/TOTAL_AYAHS*100).toFixed(1)}%) — ${pctDone}% منجز`}</td>
      <td>${dash||(rate>0?(rate*5).toFixed(0)+' آية كل 5 أيام':'—')}</td>
      <td>${dash||(days?`حوالي ${days} يوم`:'—')}</td>
      <td>${dash||(finish||'—')}</td></tr>`;
  };
  const head=(showHalaqa)=>`<div class="tw"><table><tr><th>الطالب</th>${showHalaqa?'<th>الحلقة</th>':''}<th>التحضير اليوم</th><th>التسميع والمراجعة والسبع</th><th>وصل إلى</th><th>المتبقي</th><th>المعدل</th><th>المدة المتوقعة للباقي</th><th>الانتهاء التقريبي</th></tr>`;
  const counts=arr=>{
    const parts=PERIODS_M.map(([p,n])=>{
      const xs=arr.filter(x=>subbed.has(x.s.halaqa_id+'|'+p));
      if(!xs.length) return null;
      const c=k=>xs.filter(x=>x.att[p]?.attendance===k).length;
      return `${n}: حاضر ${c('present')} · غائب ${c('absent')} · متأخر ${c('late')} · بعذر ${c('excused')}`;
    }).filter(Boolean);
    const rs=arr.filter(x=>!x.rw);
    Object.keys(RECN_M).forEach(k=>{
      const xs=rs.filter(x=>subbed.has(x.s.halaqa_id+'|'+k));
      if(xs.length) parts.push(`${RECN_M[k]} ${xs.filter(x=>x.recAll[k]).length} من ${xs.length}`);
    });
    return parts.join(' · ');
  };
  let html='';
  if(DG==='teacher'){
    const groups=TEs.map(t=>{
      const hs=HAs.filter(h=>h.teacher_id===t.id);
      const arr=[...info.values()].filter(x=>hs.some(h=>h.id===x.s.halaqa_id)&&subbedAny.has(x.s.halaqa_id));
      const pend=hs.filter(h=>!subbedAny.has(h.id)).map(h=>h.name);
      return {title:`المعلم: ${t.full_name}`,arr,pend,showHalaqa:true};
    });
    const unassigned=[...info.values()].filter(x=>!HAs.some(h=>h.id===x.s.halaqa_id&&h.teacher_id)&&subbedAny.has(x.s.halaqa_id));
    if(unassigned.length) groups.push({title:'بدون معلم',arr:unassigned,pend:[],showHalaqa:true});
    html=groups.filter(g=>g.arr.length||g.pend.length).map(g=>`<div class="grp">${esc(g.title)} <span class="note">— ${g.arr.length?counts(g.arr):'لم يُسلَّم بعد'}</span></div>${g.pend.length?`<p class="note">⏳ بانتظار تسليم: ${g.pend.map(esc).join('، ')}</p>`:''}${g.arr.length?head(true)+g.arr.map(x=>row(x,true)).join('')+'</table></div>':''}`).join('');
  } else {
    html=HAs.map(h=>{
      const arr=[...info.values()].filter(x=>x.s.halaqa_id===h.id);
      const t=TEs.find(t=>t.id===h.teacher_id);
      return {title:`الحلقة: ${h.name}`+(t?` — المعلم: ${t.full_name}`:''),arr,ok:subbedAny.has(h.id)};
    }).filter(g=>g.arr.length).map(g=>g.ok
      ?`<div class="grp">${esc(g.title)} <span class="note">— ${counts(g.arr)}</span></div>${head(false)}${g.arr.map(x=>row(x,false)).join('')}</table></div>`
      :`<div class="grp">${esc(g.title)} <span class="note">— ⏳ لم يُسلَّم بعد</span></div>`).join('');
  }
  body.innerHTML=(html||'<div class="note">لا توجد بيانات بعد.</div>')+
    `<p class="note" style="margin-top:10px">المعدل = متوسط ما يسمّعه الطالب في آخر 10 دروس تسميع، فإذا تغيّرت سرعته تتغير النتيجة تلقائياً. المدة = المتبقي ÷ المعدل اليومي (الأيام بلا تسميع لا تُحسب).</p>`;
}

/* ===== المالية ===== */
const EXP_CATS=['أدوات النظافة','الإيجار','كهرباء','تحديث دورات المياه','صيانة','مكافأة الممتحن','غذاء لجنة الإختبارات','ممتحن خارجي','طباعة أوراق الرصيد','الرواتب','أوراق الطابعة','نشاط للطلاب','مواسير دورات المياه','دفاتر التحضير','توصيلة','مصور الحفل','غسيل الفرش','حبر الطابعة','النوار','مصروفات إضافية الجمعية'];
const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mKey=(y,i)=>`${y}-${String(i+1).padStart(2,'0')}`;
const fmtN=n=>Number(n||0).toLocaleString('en-US');
const expOf=(bid,mk,c)=>{const r=EX.find(x=>x.branch_id===bid&&x.month===mk&&x.category===c);return r?Number(r.amount):null};
const expTotal=(bid,mk)=>EX.filter(x=>x.branch_id===bid&&x.month===mk).reduce((a,x)=>a+Number(x.amount||0),0);
const incomeOf=(bid,mk)=>{const ids=new Set(ST.filter(s=>s.branch_id===bid).map(s=>s.id));return PY.filter(p=>p.month===mk&&ids.has(p.student_id)).reduce((a,p)=>a+Number(p.amount||0),0)};

/* ===== التقرير المالي السنوي ===== */
function finReport(b,canEdit){
  const y=V.year||new Date().getFullYear();
  const rows=MONTHS_AR.map((m,i)=>{const mk=mKey(y,i);const inc=incomeOf(b.id,mk);const exp=expTotal(b.id,mk);return {m,mk,inc,exp,rem:inc-exp};});
  const T=rows.reduce((a,r)=>({inc:a.inc+r.inc,exp:a.exp+r.exp,rem:a.rem+r.rem}),{inc:0,exp:0,rem:0});
  const maxV=Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp)));
  const pct=v=>Math.round(v/maxV*100);
  return `<div class="fin">
    <div class="finHead"><div><h3>التقرير المالي ${y}</h3><div class="note">${esc(b.name)}</div></div>
      <label>السنة: <select onchange="setV('year',Number(this.value))">${[y-1,y,y+1].map(v=>`<option value="${v}" ${v===y?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <div class="finCards">
      <div class="fc ok"><span>إجمالي الواردات</span><b>${fmtN(T.inc)}</b></div>
      <div class="fc bad"><span>إجمالي المصروفات</span><b>${fmtN(T.exp)}</b></div>
      <div class="fc info"><span>الربح المتبقي للسنة</span><b>${fmtN(T.rem)}</b></div>
    </div>
    <div class="tw"><table class="finT">
      <tr><th>الشهر</th><th>الوارد</th><th>المصروفات</th><th>المتبقي</th><th>مقارنة</th></tr>
      ${rows.map(r=>`<tr><td>${r.m}</td><td>${fmtN(r.inc)}</td><td>${fmtN(r.exp)}</td>
        <td class="${r.rem>=0?'pos':'neg'}">${fmtN(r.rem)}</td>
        <td style="min-width:150px"><div class="bars"><i class="bi" style="width:${pct(r.inc)}%"></i></div><div class="bars"><i class="be" style="width:${pct(r.exp)}%"></i></div></td></tr>`).join('')}
      <tr class="tot"><td>المجموع</td><td>${fmtN(T.inc)}</td><td>${fmtN(T.exp)}</td><td class="${T.rem>=0?'pos':'neg'}">${fmtN(T.rem)}</td><td></td></tr>
    </table></div>
    <p class="note">الوارد = الرسوم المسدّدة في كل شهر. الرسم الأصلي للطالب 8000 ما لم يُعدَّل فردياً.</p>
    <div><button class="b keepRO ${V.expOpen?'m':'g'}" onclick="setV('expOpen',!V.expOpen)">${V.expOpen?'إخفاء جدول المصروفات':'إدخال المصروفات الشهرية'}</button></div>
    ${V.expOpen?expEntry(b,y,canEdit):''}
  </div>`;
}

function expEntry(b,y,canEdit){
  const colT=i=>EXP_CATS.reduce((a,c)=>a+(expOf(b.id,mKey(y,i),c)||0),0);
  return `<div class="card"><h3>المصروفات الشهرية ${y}</h3>
  <div class="tw"><table class="expT">
    <tr><th>البند</th>${MONTHS_AR.map(m=>`<th>${m}</th>`).join('')}<th>المجموع</th></tr>
    ${EXP_CATS.map((c,ci)=>`<tr><td>${esc(c)}</td>${MONTHS_AR.map((_,i)=>{const v=expOf(b.id,mKey(y,i),c);return `<td><input id="ex_${ci}_${i}" type="number" min="0" value="${v??''}" ${canEdit?'':'disabled'}></td>`}).join('')}
      <td class="rowT">${fmtN(MONTHS_AR.reduce((a,_,i)=>a+(expOf(b.id,mKey(y,i),c)||0),0))}</td></tr>`).join('')}
    <tr class="tot"><td>مجموع المصروفات</td>${MONTHS_AR.map((_,i)=>`<td>${fmtN(colT(i))}</td>`).join('')}<td>${fmtN(MONTHS_AR.reduce((a,_,i)=>a+colT(i),0))}</td></tr>
  </table></div>
  ${canEdit?`<div style="margin-top:10px"><button class="b g" onclick="saveExp('${b.id}',${y})">حفظ المصروفات</button></div>`:'<p class="note">العرض فقط لأمين الصندوق.</p>'}</div>`;
}

async function saveExp(bid,y){
  const ups=[], dels=[];
  for(let ci=0;ci<EXP_CATS.length;ci++){
    for(let i=0;i<12;i++){
      const el=$(`ex_${ci}_${i}`); if(!el) continue;
      const v=el.value.trim(), mk=mKey(y,i), c=EXP_CATS[ci], cur=expOf(bid,mk,c);
      if(v===''){ if(cur!==null) dels.push({mk,c}); continue; }
      const n=Number(v);
      if(isNaN(n)||n<0) return msg('مبلغ غير صحيح: '+c+' — '+MONTHS_AR[i]);
      if(cur===null||cur!==n) ups.push({branch_id:bid,month:mk,category:c,amount:n});
    }
  }
  if(!ups.length&&!dels.length) return msg('لا توجد تغييرات للحفظ');
  for(const d of dels){
    const {error}=await db.from('itqan_expenses').delete().eq('branch_id',bid).eq('month',d.mk).eq('category',d.c);
    if(error) return msg('تعذّر الحذف: '+error.message);
  }
  if(ups.length){
    const {error}=await db.from('itqan_expenses').upsert(ups,{onConflict:'branch_id,month,category'});
    if(error) return msg('تعذّر الحفظ: '+error.message);
  }
  await loadAll(); msg('تم حفظ المصروفات ✓',true); paint();
}


RV.finance=()=>{
  const b=brOf(scope()); if(!b) return noB();
  const canEdit=ME.role!=='itqan_cashier';
  const list=filtered(b.id);
  const due=list.filter(s=>!s.exempt);
  const paidN=due.filter(s=>isPaid(s.id)).length;
  const need=due.reduce((a,s)=>a+feeOf(s),0);
  const coll=PY.filter(p=>p.month===V.month&&list.some(s=>s.id===p.student_id)).reduce((a,p)=>a+Number(p.amount||0),0);
  const exL=list.filter(s=>s.exempt||(s.monthly_fee!=null&&Number(s.monthly_fee)!==Number(b.monthly_fee)));
  return finReport(b,canEdit)+`<div class="card"><div class="row"><b>الرسم الأصلي: ${b.monthly_fee}</b><b>رسوم القبول: ${b.admission_fee}</b>
    <span class="ok">سدّد هذا الشهر: ${paidN} من ${due.length}</span><span>المطلوب: ${need}</span><span>المحصّل: ${coll}</span>
    <button class="b g keepRO" onclick="setV('fx',!V.fx)">${V.fx?'إخفاء القائمة':'قائمة المعفيين والمخفّضين'} (${exL.length})</button></div></div>
  ${V.fx?`<div class="card"><h3>المعفيون والمخفّضون</h3><div class="tw"><table><tr><th>الطالب</th><th>الحلقة</th><th>المطلوب شهرياً</th><th>الحالة</th><th>ملاحظة</th></tr>
    ${exL.map(s=>`<tr><td>${sName(s)}</td><td>${esc(haOf(s.halaqa_id)?.name||'—')}</td><td>${feeOf(s)}</td><td>${feeStatus(s)}</td><td>${esc(s.fee_note||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="note">لا يوجد معفيون ولا مخفّضون</td></tr>'}</table></div></div>`:''}
  <div class="tw"><table><tr><th>الطالب</th><th>الجنس</th><th>الحلقة</th><th>المطلوب</th><th>رسوم القبول</th><th>سداد الشهر ${V.month}</th></tr>
  ${list.map(s=>{const pd=isPaid(s.id);return `<tr>
    <td>${sName(s)}</td><td>${GN[s.gender]}</td><td>${esc(haOf(s.halaqa_id)?.name||'—')}</td>
    <td>${s.exempt?'<span class="ok">معفى</span>':`${feeOf(s)}${s.monthly_fee!=null?` <span class="note">(${feeStatus(s)})</span>`:''}`}</td>
    <td>${canEdit?`<button class="b ${s.admission_paid?'g':'m'}" onclick="toggleAdm('${s.id}',${!s.admission_paid})">${s.admission_paid?'مسدّد ✓':'لم يسدّد'}</button>`:(s.admission_paid?'<span class="ok">مسدّد</span>':'<span class="bad">لم يسدّد</span>')}</td>
    <td>${s.exempt?'<span class="note">لا يلزم</span>':`<span class="${pd?'ok':'bad'}">${pd?'سدّد':'لم يسدّد'}</span> <button class="b ${pd?'m':'g'}" onclick="togglePay('${s.id}')">${pd?'إلغاء السداد':'تسجيل السداد'}</button>`}</td></tr>`;}).join('')
    ||'<tr><td colspan="6" class="note">لا يوجد طلاب</td></tr>'}</table></div>`;
};

function toggleAdm(sid,val){dbDo(db.from('itqan_students').update({admission_paid:val}).eq('id',sid))}

function togglePay(sid){
  const s=ST.find(x=>x.id===sid);
  const p=PY.find(x=>x.student_id===sid&&x.month===V.month);
  if(p) return dbDo(db.from('itqan_payments').delete().eq('id',p.id),'تم إلغاء السداد');
  if(!s) return;
  if(s.exempt) return msg('الطالب معفى من السداد');
  const amt=feeOf(s);
  if(amt<=0) return msg('لا يوجد مبلغ مطلوب لهذا الطالب');
  dbDo(db.from('itqan_payments').insert({student_id:sid,month:V.month,amount:amt}),'تم تسجيل السداد ✓');
}

      return `<tr><td>${esc(t.full_name)}</td><td>${esc(t.phone||'')}</td><td>${hh.map(x=>esc(x.name)).join('، ')||'—'}</td><td>${n}</td></tr>`;}).join('')

function addTeacher(){
  const n=$('tName').value.trim();
  if(!n) return msg('اكتب اسم المعلم');
  dbDo(db.from('itqan_teachers').insert({branch_id:scope(),full_name:n,phone:$('tPhone').value.trim()||null}),'تمت إضافة المعلم ✓');
}

/* ===== التقارير: شاملة، مالية في كل فرع، جودة ومتابعة الفروع ===== */
RV.reports=()=>{
  const tabs=[['','التقرير الشامل','c-dark'],['fin','المالية في كل فرع','c-red'],['quality','الجودة ومتابعة جميع الفروع','c-teal']];
  const bar=`<div class="row" style="margin-bottom:12px">${tabs.map(([k,n])=>`<button class="b keepRO ${(V.rsub||'')===k?'m':'g'}" onclick="setV('rsub','${k}')">${n}</button>`).join('')}</div>`;
  const body=V.rsub==='fin'?repFinance():V.rsub==='quality'?repQuality():repOverall();
  return bar+body;
};

function repFinance(){
  const y=V.year||new Date().getFullYear(), mk=V.month;
  const rows=BR.map(b=>{
    const ss=ST.filter(s=>s.branch_id===b.id);
    const due=ss.filter(s=>!s.exempt);
    const need=due.reduce((a,s)=>a+feeOf(s),0);
    const ids=new Set(ss.map(s=>s.id));
    const collM=PY.filter(p=>p.month===mk&&ids.has(p.student_id)).reduce((a,p)=>a+Number(p.amount||0),0);
    const incY=Array.from({length:12},(_,i)=>incomeOf(b.id,mKey(y,i))).reduce((a,v)=>a+v,0);
    const expY=Array.from({length:12},(_,i)=>expTotal(b.id,mKey(y,i))).reduce((a,v)=>a+v,0);
    return {b,n:ss.length,need,collM,incY,expY,remY:incY-expY};
  });
  const T=rows.reduce((a,r)=>({n:a.n+r.n,need:a.need+r.need,collM:a.collM+r.collM,incY:a.incY+r.incY,expY:a.expY+r.expY,remY:a.remY+r.remY}),{n:0,need:0,collM:0,incY:0,expY:0,remY:0});
  const cell=v=>`<span class="${v>=0?'pos':'neg'}">${fmtN(v)}</span>`;
  return `<div class="card"><div class="row" style="justify-content:space-between">
      <h3 style="margin:0">المالية في كل فرع</h3>
      <div class="row"><label>الشهر: <input type="month" value="${mk}" onchange="setV('month',this.value)"></label>
      <span class="note">سنة ${y}: الوارد والمصروفات السنوية</span></div></div></div>
    <div class="tw"><table class="finT">
      <tr><th>الفرع</th><th>الطلاب</th><th>المطلوب شهرياً</th><th>محصّل ${mk}</th><th>نسبة التحصيل</th><th>وارد ${y}</th><th>مصروفات ${y}</th><th>المتبقي ${y}</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.b.name)}</td><td>${r.n}</td><td>${fmtN(r.need)}</td><td>${fmtN(r.collM)}</td>
        <td>${r.need?Math.round(r.collM/r.need*100):0}%</td><td>${fmtN(r.incY)}</td><td>${fmtN(r.expY)}</td><td>${cell(r.remY)}</td></tr>`).join('')||'<tr><td colspan="8" class="note">لا توجد فروع</td></tr>'}
      <tr class="tot"><td>المجموع</td><td>${T.n}</td><td>${fmtN(T.need)}</td><td>${fmtN(T.collM)}</td>
        <td>${T.need?Math.round(T.collM/T.need*100):0}%</td><td>${fmtN(T.incY)}</td><td>${fmtN(T.expY)}</td><td>${cell(T.remY)}</td></tr>
    </table></div>`;
}

function repQuality(){
  const rows=BR.map(b=>{
    const ss=ST.filter(s=>s.branch_id===b.id);
    const hs=HA.filter(h=>h.branch_id===b.id);
    const n=ss.length;
    const pct=x=>n?Math.round(x/n*100):0;
    const noHalaqa=ss.filter(s=>!s.halaqa_id).length;
    const noGender=ss.filter(s=>!s.gender).length;
    const qProg=ss.filter(s=>s.quran_progress&&String(s.quran_progress).trim()).length;
    const rwProg=ss.filter(s=>s.rw_progress&&String(s.rw_progress).trim()).length;
    const noTeacher=hs.filter(h=>!h.teacher_id).length;
    const last=ss.map(s=>s.progress_updated_at).filter(Boolean).sort().pop();
    const score=n?Math.round((pct(qProg)+pct(rwProg)+(100-pct(noHalaqa))+(100-pct(noGender)))/4):0;
    return {b,n,noTeacher,noHalaqa,noGender,qPct:pct(qProg),rwPct:pct(rwProg),last,score};
  });
  const col=v=>v>=80?'#15803d':v>=50?'#b45309':'#b91c1c';
  return `<div class="card"><h3>الجودة ومتابعة جميع الفروع</h3>
    <p class="note">مؤشر الجودة يجمع: متابعة الحفظ، ومتابعة القراءة والكتابة، وتسكين كل طالب في حلقة، وتحديد جنس كل طالب. الهدف 80 فأكثر.</p></div>
    <div class="tw"><table class="finT">
      <tr><th>الفرع</th><th>الطلاب</th><th>حلقات بلا معلم</th><th>طلاب بلا حلقة</th><th>طلاب بلا جنس</th><th>متابعة الحفظ</th><th>متابعة القراءة</th><th>آخر متابعة</th><th>مؤشر الجودة</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.b.name)}</td><td>${r.n}</td>
        <td class="${r.noTeacher?'neg':'pos'}">${r.noTeacher}</td><td class="${r.noHalaqa?'neg':'pos'}">${r.noHalaqa}</td><td class="${r.noGender?'neg':'pos'}">${r.noGender}</td>
        <td>${r.qPct}%</td><td>${r.rwPct}%</td><td>${r.last?String(r.last).slice(0,10):'—'}</td>
        <td><b style="color:${col(r.score)};font-size:20px">${r.score}</b>
          <div class="bars" style="min-width:90px"><i style="display:block;height:100%;width:${r.score}%;background:${col(r.score)}"></i></div></td></tr>`).join('')||'<tr><td colspan="9" class="note">لا توجد فروع</td></tr>'}
    </table></div>`;
}

function repOverall(){
  const rows=BR.map(b=>{
    const ss=ST.filter(s=>s.branch_id===b.id);
    const paid=ss.filter(s=>PY.some(p=>p.student_id===s.id&&p.month===V.month)).length;
    const coll=PY.filter(p=>p.month===V.month&&ss.some(s=>s.id===p.student_id)).reduce((a,p)=>a+Number(p.amount||0),0);
    return `<tr><td>${esc(b.name)}</td><td>${HA.filter(h=>h.branch_id===b.id).length}</td><td>${TE.filter(t=>t.branch_id===b.id).length}</td>
      <td>${ss.length}</td><td>${ss.filter(s=>s.gender==='boy').length}</td><td>${ss.filter(s=>s.gender==='girl').length}</td>
      <td>${ss.filter(s=>s.admission_paid).length}</td><td>${paid}</td><td>${ss.length-paid}</td><td>${coll}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="row"><h3 style="margin:0">تقرير شامل</h3>
    <label>الشهر: <input type="month" value="${V.month}" onchange="setV('month',this.value)"></label></div></div>
    <div class="tw"><table><tr><th>الفرع</th><th>الحلقات</th><th>المعلمون</th><th>الطلاب</th><th>طلاب</th><th>طالبات</th><th>قبول مسدد</th><th>سدّد الشهر</th><th>لم يسدّد</th><th>المحصّل</th></tr>
    ${rows||'<tr><td colspan="10" class="note">لا توجد فروع بعد</td></tr>'}</table></div>`;
};

  await db.auth.signOut();
  location.reload();
}
