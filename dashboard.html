<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم - معهد الإحسان</title>
<style>
*{box-sizing:border-box}
:root{--gold:#c9a04a;--green:#1b6b3a;--dark:#123d24;--cream:#fbf7ee}
body{margin:0;font-family:Tahoma,Cairo,sans-serif;color:#2a1d0a;min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(201,160,74,.18),transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(27,107,58,.18),transparent 40%),
    var(--cream);
  overflow-x:hidden}

/* نقش إسلامي متحرك في الخلفية */
.pattern{position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><g fill='none' stroke='%23c9a04a' stroke-opacity='.35' stroke-width='1.2'><path d='M45 0 L63 18 L90 18 L72 45 L90 72 L63 72 L45 90 L27 72 L0 72 L18 45 L0 18 L27 18 Z'/><path d='M45 18 L63 45 L45 72 L27 45 Z'/><circle cx='45' cy='45' r='6'/></g></svg>");
  background-size:90px 90px;animation:drift 60s linear infinite}
@keyframes drift{from{transform:rotate(0deg) translate(0,0)}to{transform:rotate(360deg) translate(0,0)}}

/* الشريط العلوي مع الشعار */
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--dark),var(--green));color:#fff;padding:14px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);position:relative;overflow:hidden}
.header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:translateX(-100%);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.logoBox{background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:float 4s ease-in-out infinite}
.logoBox img{height:70px;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.title{text-align:center;flex:1;min-width:200px}
.title h1{margin:0;font-size:24px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.title .sub{font-size:13px;opacity:.9;margin-top:2px}

/* الشريط الإخباري */
.ticker{background:var(--gold);color:var(--dark);overflow:hidden;white-space:nowrap;padding:8px 0;font-weight:700}
.ticker-track{display:inline-block;padding-left:100%;animation:scroll 30s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ticker .sep{margin:0 26px;color:var(--green)}

/* الترحيب */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px}
.who{font-size:17px;font-weight:800;color:var(--dark)}
.role{font-size:13px;color:#6b5a3e}
.logout{background:#b3261e;color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;cursor:pointer}

/* بطاقات الإحصاء */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:0 20px}
.stat{background:rgba(255,255,255,.9);border:1px solid #e8d3a2;border-radius:16px;padding:14px;text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.06);animation:fadeUp .6s ease both}
.stat .n{font-size:28px;font-weight:900;color:var(--green)}
.stat .t{font-size:13px;color:#6b5a3e}

/* الأزرار */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:18px 20px 30px}
.tile{position:relative;display:block;text-decoration:none;color:#fff;border-radius:20px;padding:22px 18px;min-height:128px;overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .25s ease,box-shadow .25s ease;animation:fadeUp .6s ease both}
.tile:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 28px rgba(0,0,0,.2)}
.tile::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M20 0 L26 14 L40 20 L26 26 L20 40 L14 26 L0 20 L14 14 Z' fill='none' stroke='%23ffffff' stroke-opacity='.12'/></svg>");opacity:.8}
.tile::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .7s ease}
.tile:hover::after{left:125%}
.tile>*{position:relative;z-index:1}
.tile .ic{font-size:34px;display:block;margin-bottom:6px;animation:bob 2.8s ease-in-out infinite}
.tile .tt{font-size:17px;font-weight:800}
.tile .ds{font-size:12px;opacity:.92;margin-top:2px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.c-orange{background:linear-gradient(135deg,#e5572a,#f7941d)}
.c-green{background:linear-gradient(135deg,#1b6b3a,#2f9e5a)}
.c-blue{background:linear-gradient(135deg,#0b5c9a,#2196d3)}
.c-gold{background:linear-gradient(135deg,#a86a00,#e0a526)}
.c-dark{background:linear-gradient(135deg,#4a3a2a,#7a5c3a)}
.tile.soon{background:#ece6d6;color:#6b5a3e;cursor:not-allowed;box-shadow:none}
.tile.soon:hover{transform:none}
.tile.soon::after,.tile.soon::before{display:none}
.badge{position:absolute;top:10px;left:10px;background:#fff;color:#8a6100;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;z-index:2}

/* شاشة الدخول */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:18px}
#login .logoBox img{height:120px}
.loginCard{background:rgba(255,255,255,.95);border-radius:22px;padding:26px;width:100%;max-width:420px;
  box-shadow:0 14px 34px rgba(0,0,0,.14);animation:fadeUp .7s ease both}
.loginCard h2{text-align:center;color:var(--green);margin:4px 0 14px}
.loginCard input{width:100%;font:inherit;padding:12px;border:1px solid #e8d3a2;border-radius:12px;margin:6px 0}
.loginCard button{width:100%;font:inherit;font-weight:800;background:linear-gradient(135deg,#e5572a,#f7941d);color:#fff;border:0;border-radius:12px;padding:12px;cursor:pointer;margin-top:8px}
.msg{color:#b3261e;font-weight:700;min-height:20px}
.hidden{display:none!important}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pattern"></div>

<div id="login">
  <div class="logoBox"><img src="logo.png" alt="شعار معهد الإحسان"></div>
  <div class="loginCard">
    <h2>أهلاً بكم في النظام الإداري والتحكم</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="pass" type="password" placeholder="كلمة المرور">
    <button onclick="doLogin()">دخول</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="logoBox"><img src="logo.png" alt="شعار معهد الإحسان"></div>
    <div class="title">
      <h1>أهلاً بكم في النظام الإداري والتحكم</h1>
      <div class="sub">معهد الإحسان لإعداد العلماء</div>
    </div>
    <div class="logoBox" style="padding:10px 14px;background:#fff;color:var(--green);font-weight:800;border-radius:14px">
      منظمة الإحسان<br><small>للرعاية الاجتماعية</small>
    </div>
  </div>

  <div class="ticker"><div class="ticker-track" id="tickerText"></div></div>

  <div class="bar">
    <div>
      <div class="who" id="who"></div>
      <div class="role" id="roleName"></div>
    </div>
    <button class="logout" onclick="doLogout()">خروج</button>
  </div>

  <div id="statsWrap" class="stats hidden"></div>
  <div class="grid" id="grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://tmhfjnqujgmwayktsbnd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CZiS1VnVdN3hnc9YT1k4wg_0uE7yNmL';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

const ROLE_NAMES = {
  org_manager: 'مدير المنظمة', exec_manager: 'مدير التنفيذ',
  institute_general: 'المدير العام للمعهد', institute_manager: 'مدير المعهد',
  secretary: 'السكرتير', cashier: 'أمين الصندوق',
  student_affairs: 'شؤون الطلاب', exams: 'قسم الامتحانات'
};

const TILES = {
  register:   { t:'تسجيل طالب جديد',          d:'استمارة الطالب الجديد',           c:'c-orange', href:'register.html' },
  students:   { t:'دليل الطلاب',               d:'بحث وتعديل وملفات الطلاب',        c:'c-blue',   href:'admin.html' },
  classes:    { t:'الفصول والمجموعات',         d:'عرض الفصول وطلاب كل فصل',          c:'c-green',  href:'admin.html' },
  generate:   { t:'التوليد وإدارة الفصول',     d:'ترحيل السنة ونقل الطلاب',         c:'c-green',  href:'manage.html' },
  import:     { t:'استيراد من Excel',          d:'إضافة كشوف الطلاب دفعة واحدة',    c:'c-blue',   href:'import.html' },
  cashier:    { t:'تحصيل الرسوم',              d:'دفع الرسوم الشهرية والقبول',      c:'c-gold',   href:'admin.html' },
  unpaid:     { t:'كشف المتأخرات',             d:'الطلاب غير المسددين لهذا الشهر',  c:'c-gold',   href:'admin.html' },
  finance:    { t:'الملخص المالي',             d:'المطلوب والمسدد والمتبقي',        c:'c-dark',   href:'admin.html' },
  attendance: { t:'الحضور والغياب',            d:'تسجيل الغياب اليومي والأسبوعي',   soon:true },
  certs:      { t:'الإفادات والشهادات',        d:'إفادة قيد وشهادة حسن سيرة',      soon:true },
  contact:    { t:'سجل التواصل وأولياء الأمور', d:'الرسائل والإشعارات',           soon:true },
  staff:      { t:'إدارة الكادر التعليمي',     d:'المعلمون والتكليفات والأداء',      soon:true },
  reports:    { t:'التقارير الشاملة',          d:'النجاح والرسوب والتسجيل',         soon:true },
  announce:   { t:'الإعلانات والتعاميم',       d:'نشر قرار يظهر للجميع',            soon:true },
  activity:   { t:'سجل الأنشطة',               d:'من فعل ماذا ومتى',                 soon:true },
  receipts:   { t:'سندات القبض',               d:'إصدار سند قبض لكل دفعة',          soon:true },
  expenses:   { t:'سندات الصرف',               d:'مصروفات المعهد التشغيلية',        soon:true },
  exam_cards: { t:'بطاقات الامتحان',           d:'لمن سدد الرسوم كاملة',             soon:true },
  exam_sched: { t:'جداول الاختبارات',          d:'توزيع القاعات والطلاب',           soon:true }
};
// توجيه كل زر إلى القسم المناسب داخل صفحة الإدارة
TILES.students.href = 'admin.html?tab=students';
TILES.classes.href  = 'admin.html?tab=classes';
TILES.cashier.href  = 'admin.html?tab=cashier';
TILES.unpaid.href   = 'admin.html?tab=cashier';
TILES.finance.href  = 'admin.html?tab=cashier';
const ICONS = {
  register:'📝', students:'👥', classes:'🏫', generate:'🔄', import:'📥',
  cashier:'💰', unpaid:'⚠️', finance:'📊', receipts:'🧾', expenses:'💳',
  exam_cards:'🎫', exam_sched:'🗓️', attendance:'✅', certs:'📜', contact:'📨',
  staff:'👨‍🏫', reports:'📈', announce:'📢', activity:'🕘'
};

const ROLE_TILES = {
  secretary:         ['register','students','classes','attendance','certs','contact'],
  institute_general: ['students','classes','generate','import','register','cashier','unpaid','finance','staff','reports','announce','activity'],
  institute_manager: ['students','classes','generate','import','register','cashier','unpaid','finance','staff','reports','announce','activity'],
  org_manager:       ['students','finance','reports'],
  exec_manager:      ['students','finance','reports'],
  cashier:           ['cashier','unpaid','receipts','expenses','students'],
  student_affairs:   ['students','classes','certs','attendance','contact'],
  exams:             ['students','classes','exam_cards','exam_sched']
};
ROLE_NAMES.teacher = 'معلم';
TILES.attendance = {t:'الحضور والغياب', d:'سجل الحضور والغياب لكل طالب', c:'c-blue', href:'attendance.html'};
TILES.timetable  = {t:'الجدول الدراسي', d:'عرض الجدول، وتحضير حصص المعلمين', c:'c-green', href:'timetable.html'};
ICONS.timetable = '🗓️';
ROLE_TILES.teacher = ['timetable'];
for (const r of Object.keys(ROLE_TILES)) {
  if (!ROLE_TILES[r].includes('timetable')) ROLE_TILES[r].push('timetable');
}
['secretary','institute_general','institute_manager','student_affairs','org_manager','exec_manager'].forEach(r => {
  if (!ROLE_TILES[r].includes('attendance')) ROLE_TILES[r].push('attendance');
});
  const STATS_ROLES = ['institute_general','institute_manager','org_manager','exec_manager'];

const MESSAGES = [
  'يرفع الله الذين آمنوا منكم والذين أوتوا العلم درجات',
  'الدقة في البيانات أمانة، والتنظيم عون على الخدمة',
  'التعليم رسالة، والإدارة خدمة لها',
  'أهلاً بكم في نظام معهد الإحسان لإعداد العلماء'
];

function setTicker() {
  const line = MESSAGES.map(m => `<span>${m}</span><span class="sep">✦</span>`).join('');
  $('tickerText').innerHTML = line + line;
}

async function doLogin() {
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) { $('loginMsg').textContent = 'البريد أو كلمة المرور غير صحيحة'; return; }
  start();
}

async function doLogout() {
  await db.auth.signOut();
  location.reload();
}

async function start() {
  const { data: { user } } = await db.auth.getUser();
  const { data: prof, error } = await db.from('profiles').select('full_name, role').eq('id', user.id).single();
  if (error || !prof || !ROLE_TILES[prof.role]) {
    $('loginMsg').textContent = 'هذا الحساب غير مرتبط بدور في النظام';
    await db.auth.signOut();
    return;
  }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = `مرحباً، ${prof.full_name}`;
  $('roleName').textContent = ROLE_NAMES[prof.role];
  setTicker();
  renderTiles(prof.role);
  if (STATS_ROLES.includes(prof.role)) loadStats();
}

function renderTiles(role) {
  $('grid').innerHTML = ROLE_TILES[role].map((key, i) => {
    const t = TILES[key];
    const delay = (i * 0.07).toFixed(2);
    if (t.soon) {
      return `<div class="tile soon" style="animation-delay:${delay}s">
        <span class="badge">قريباً</span>
        <span class="ic">${ICONS[key] || '⏳'}</span><div class="tt">${t.t}</div><div class="ds">${t.d}</div></div>`;
    }
    return `<a class="tile ${t.c}" href="${t.href}" style="animation-delay:${delay}s">
      <span class="ic">${ICONS[key] || '📌'}</span><div class="tt">${t.t}</div><div class="ds">${t.d}</div></a>`;
  }).join('');
}

async function loadStats() {
  const [total, boarders, pending, legacy, classes] = await Promise.all([
    db.from('students').select('id', { count: 'exact', head: true }),
    db.from('students').select('id', { count: 'exact', head: true }).eq('is_boarder', true),
    db.from('students').select('id', { count: 'exact', head: true }).eq('status', 'pending_fee'),
    db.from('students').select('id', { count: 'exact', head: true }).eq('is_legacy', true),
    db.from('classes').select('id', { count: 'exact', head: true })
  ]);
  const items = [
    ['إجمالي الطلاب', total.count], ['الداخليون', boarders.count],
    ['بانتظار تسديد القبول', pending.count], ['طلاب سابقون', legacy.count],
    ['عدد الفصول', classes.count]
  ];
  $('statsWrap').innerHTML = items.map(([t, n], i) =>
    `<div class="stat" style="animation-delay:${i * 0.1}s"><div class="n" data-n="${n || 0}">0</div><div class="t">${t}</div></div>`
  ).join('');
  $('statsWrap').classList.remove('hidden');
  countUp();
}

function countUp() {
  document.querySelectorAll('.stat .n').forEach(el => {
    const target = Number(el.dataset.n) || 0;
    const steps = 40;
    let i = 0;
    const timer = setInterval(() => {
      i++;
      el.textContent = Math.round(target * i / steps).toLocaleString('en');
      if (i >= steps) clearInterval(timer);
    }, 25);
  });
}

db.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script>
</body>
</html>
