 return `<div class="card"><h3>١. الفصول</h3>`+CLASSES.map((c,i)=>`<div class="rw"><input data-cn="${i}" value="${esc(c)}"><button class="btn" data-act="delc" data-i="${i}">حذف</button></div>`).join('')+

 <div class="card"><h3>الإسنادات الحالية</h3>${names.length?names.map(n=>{const l=ld(by[n].map(i=>ASG[i]));return `<div style="margin:10px 0 4px"><b>${esc(n)}</b> <span class="${l>30?'bad':'ok'}">— ${l} / 30 حصة</span></div>`+by[n].map(i=>{const a=ASG[i];return `<div class="rw"><span>${esc(a.s)}</span><span>${esc(CLASSES[a.c]||'')}</span><input type="number" min="1" max="30" data-ah="${i}" value="${a.h}" style="width:70px">${a.g?'<i>مشتركة</i>':''}<button class="btn" data-act="dela" data-i="${i}">حذف</button></div>`}).join('')}).join(''):'<p>لا توجد إسنادات بعد. أضف إسناداً أو استورد من الجدول الحالي.</p>'}</div>

let gres='';
const A={
 addc(){const v=$('newc').value.trim();if(!v)return;CLASSES.push(v);G.forEach(d=>d.push(Array.from({length:6},()=>['',''])));persist();render()},
 delc(i){if(!confirm('حذف الفصل "'+CLASSES[i]+'" وكل حصصه؟'))return;CLASSES.splice(i,1);G.forEach(d=>d.splice(i,1));ASG=ASG.filter(a=>a.c!==i).map(a=>a.c>i?{...a,c:a.c-1}:a);persist();render()},
 addt(){const v=$('newt').value.trim();if(v&&!TL.includes(v)){TL.push(v);TL=uq(TL);persist()}render()},
 adds(){const v=$('news').value.trim();if(v&&!SL.includes(v)){SL.push(v);SL=uq(SL);persist()}render()},
 delt(i){const n=TL[i],u=ASG.filter(a=>a.t===n).length;if(u&&!confirm('للمعلم '+u+' إسناداً، سيتم حذفها أيضاً. متابعة؟'))return;ASG=ASG.filter(a=>a.t!==n);TL.splice(i,1);if(selT===n)selT='';persist();render()},
 dels(i){const n=SL[i],u=ASG.filter(a=>a.s===n).length;if(u&&!confirm('للمادة '+u+' إسناداً، سيتم حذفها أيضاً. متابعة؟'))return;ASG=ASG.filter(a=>a.s!==n);SL.splice(i,1);if(selS===n)selS='';persist();render()},
 all(){document.querySelectorAll('.ac').forEach(x=>x.checked=true)},
 adda(){const t=$('at').value.trim(),s=$('as').value.trim(),h=Math.max(1,Math.min(30,+$('ah').value||1));const cs=[...document.querySelectorAll('.ac:checked')].map(x=>+x.value);
  if(!t||!s||!cs.length){msg=TL.length&&SL.length?'اختر المعلم والمادة وفصلاً واحداً على الأقل':'أضف معلمين ومواد أولاً';return render()}
  const g=$('ag').checked&&cs.length>1?t+'|'+s+'|'+Date.now():'';cs.forEach(c=>{const o=!g&&ASG.find(a=>a.c===c&&a.s===s&&a.t===t&&!a.g);if(o)o.h=h;else ASG.push({c,s,t,h,g})});selT=t;selS='';msg='';persist();render()},
 dela(i){ASG.splice(i,1);persist();render()},
 imp(){if(ASG.length&&!confirm('سيُستبدل الإسناد الحالي. متابعة؟'))return;
  const m={},j={};
  G.forEach((d,di)=>d.forEach((row,r)=>row.forEach((c,p)=>{if(!c[0]||!c[1])return;const k=r+'|'+c[0]+'|'+c[1];m[k]=(m[k]||0)+1;const sk=di+'|'+p+'|'+c[0]+'|'+c[1];(j[sk]=j[sk]||new Set()).add(r)})));
  const jt=new Set();Object.entries(j).forEach(([sk,set])=>{if(set.size>1){const [,,s,t]=sk.split('|');set.forEach(r=>jt.add(r+'|'+s+'|'+t))}});
  ASG=Object.entries(m).map(([k,h])=>{const [r,s,t]=k.split('|');return{c:+r,s,t,h,g:jt.has(k)?t+'|'+s:''}});
  TL=uq([...TL,...ASG.map(a=>a.t)]);SL=uq([...SL,...ASG.map(a=>a.s)]);gres='تم استيراد '+ASG.length+' إسناداً.';persist();render()},
 gen(){
  if(!ASG.length){gres='<span class="bad">أضف إسنادات أولاً.</span>';return render()}
  const gm={},U=[];
  ASG.forEach(a=>{if(a.g){const o=gm[a.g]=gm[a.g]||{cls:[],s:a.s,t:a.t,h:0};o.cls.push(a.c);o.h=Math.max(o.h,a.h)}else for(let i=0;i<a.h;i++)U.push({cls:[a.c],s:a.s,t:a.t,k:a.c+'|'+a.s})});
  Object.values(gm).forEach(o=>{for(let i=0;i<o.h;i++)U.push({cls:o.cls,s:o.s,t:o.t,k:o.cls.join()+'|'+o.s})});
  const tl={},cl={},bad=[];U.forEach(u=>{tl[u.t]=(tl[u.t]||0)+1;u.cls.forEach(c=>cl[c]=(cl[c]||0)+1)});
  Object.entries(tl).forEach(([t,n])=>{if(n>30)bad.push(`المعلم ${t}: ${n} حصة (الحد 30)`)});
  Object.entries(cl).forEach(([c,n])=>{if(n>30)bad.push(`الفصل ${CLASSES[c]}: ${n} حصة (الحد 30)`)});
  if(bad.length){gres='<div class="bad">لا يمكن التوزيع، الحمل أكبر من المتاح:<br>'+bad.join('<br>')+'</div>';return render()}
  if(!confirm('سيُستبدل الجدول الحالي بالجدول المولَّد. متابعة؟'))return;
  const NS=30;let best=null,bestLeft=1e9;const T0=performance.now();
  for(let at=0;at<6&&bestLeft>0&&performance.now()-T0<9000;at++){
   const cb=CLASSES.map(()=>Array(NS).fill(-1)),tb={},kd={},td={},tab={};
   U.forEach((u,i)=>{u.id=i;u.slot=-1;tb[u.t]=tb[u.t]||Array(NS).fill(-1)});
   const put=(u,s)=>{u.slot=s;const d=s/6|0;u.cls.forEach(c=>cb[c][s]=u.id);tb[u.t][s]=u.id;kd[u.k+d]=(kd[u.k+d]||0)+1;td[u.t+d]=(td[u.t+d]||0)+1};
   const rm=u=>{const s=u.slot,d=s/6|0;u.cls.forEach(c=>cb[c][s]=-1);tb[u.t][s]=-1;kd[u.k+d]--;td[u.t+d]--;u.slot=-1};
   const conf=(u,s)=>[...new Set([...u.cls.map(c=>cb[c][s]),tb[u.t][s]].filter(x=>x>=0&&x!==u.id))];
   let q=U.slice().sort((a,b)=>tl[b.t]-tl[a.t]||b.cls.length-a.cls.length||Math.random()-.5);
   const t0=performance.now();
   while(q.length&&performance.now()-t0<2200){
    const u=q.shift();let bs=1e9,bsl=0,bc=[];
    for(let s=0;s<NS;s++){const cf=conf(u,s),d=s/6|0;
     const sc=cf.length*1000+cf.reduce((n,id)=>n+U[id].cls.length*200,0)+(kd[u.k+d]||0)*60+(td[u.t+d]||0)*4+(tab[u.id]===s?500:0)+Math.random()*6;
     if(sc<bs){bs=sc;bsl=s;bc=cf}}
    bc.forEach(id=>{const v=U[id];tab[id]=bsl;rm(v);q.push(v)});
    put(u,bsl)}
   if(q.length<bestLeft){bestLeft=q.length;best=U.map(u=>u.slot)}}
  U.forEach((u,i)=>u.slot=best[i]);const q=U.filter(u=>u.slot<0);
  G=G.map(d=>CLASSES.map(()=>Array.from({length:6},()=>['','']))) ;
  U.forEach(u=>{if(u.slot<0)return;const d=u.slot/6|0,p=u.slot%6;u.cls.forEach(c=>G[d][c][p]=[u.s,u.t])});
  const left=q.length;
  gres=left?`<div class="bad">تم توزيع ${U.length-left} من ${U.length} حصة. تعذر وضع ${left} حصة (جرّب التوليد مرة أخرى أو خفّض الأحمال):<br>${q.slice(0,12).map(u=>esc(u.s+' — '+u.t+' — '+u.cls.map(c=>CLASSES[c]).join('، '))).join('<br>')}</div>`:`<div class="ok">✓ تم توزيع كل الحصص (${U.length}) دون أي تعارض. راجع الجدول من تبويب «حسب اليوم».</div>`;
  persist();render()}
};

  const {data:prof,error}=await db.from('profiles').select('full_name,role,teacher_keys').eq('id',user.id).single();

}
